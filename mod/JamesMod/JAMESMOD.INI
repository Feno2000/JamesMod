; JamesMod settings - read at the start of every game, no rebuild needed.
; Delete a line to go back to the original EA value. Check JAMESMOD.LOG after
; starting a game to see what actually loaded.

[Game]
; Skirmish starting credits as % of the lobby setting, plus a flat bonus.
; Try 1000 for a quick check that the mod is live.
CreditsPercent=100
CreditsBonus=0

[AI]
; Attack timing. Each unit = a random 0.5-2 minutes. EA defaults: 3 and 5.
AttackInterval=2
AttackDelay=3
HarvestersPerRefinery=2        ; AI keeps this many harvesters per refinery
ReplaceHarvestersOnHard=1      ; stock AI never replaces harvesters on Hard
StatusLogSeconds=30            ; AI status line in JAMESMOD_TRACE.LOG (0 = off)
AbandonUnplaceableAfter=30     ; seconds before the AI gives up on a building it has no room to place (0 = never)
MinVehicleCap=40               ; stock AI caps itself at your unit count + 10 (harvesters included)
MinInfantryCap=40
PlacementRadius=16             ; if its normal building spots are full, search this many cells around the base
KeepGrowingBase=1              ; once the stock build list is satisfied, keep adding power, silos, refineries, factories, defences...
GrowthMinMoney=1500            ; ...when it has at least this much money
MaxInfantryPerVehicle=2        ; stop training infantry beyond 6 + 2 per combat vehicle (0 = no limit)
PreferHeavyUnits=1             ; weight vehicle choice towards expensive/heavy units
MinDefences=6                  ; always keep at least this many towers/turrets (built ahead of other buildings)
BuildingsPerDefence=3          ; target one tower per 3 buildings if that is more - also the cap for base growth
NeverSell=1                    ; skirmish AI never sells damaged buildings, spare power plants, or everything (fire sale)
RepairMinMoney=200             ; repair damaged buildings with at least this much money (stock: 1000)
RebuildConstructionYard=1      ; build an MCV to replace a lost construction yard

; Base building - ratio is % of the AI's buildings, limit is the max count.
; EA defaults: Refinery 16%/4, Barracks 16%/2, War Factory 10%/2, Defence 40%/40
RefineryRatio=20
RefineryLimit=5
WarRatio=15
WarLimit=3
BarracksLimit=2

[Harvester]
; Light machine gun on harvesters. By default it only fires at infantry that are
; shooting at the harvester (stray civilians, farmers, lone riflemen). Passive
; civilians are never targeted.
SelfDefence=1
PlayerHarvesters=1
AIHarvesters=1
FireAtAnyEnemy=0     ; 1 = also shoot enemy infantry in range that are not attacking it
Range=3              ; cells (a rifleman is ~2-3)
Damage=15            ; per burst (M16 rifleman = 15, humvee MG = 15)
RateOfFire=15       ; ticks between bursts (lower = faster; ~15 ticks per second at normal speed)

; Player harvesters left sitting on guard (after chasing an attacker, or being moved
; out of danger) go back to harvesting once it is safe. Keep one selected to hold it.
AutoResume=1
ResumeDelay=20       ; seconds idle before resuming
SafeTime=10          ; seconds since it was last shot before resuming
ResumeMessage=1      ; on-screen "Harvester resuming harvesting" message
ResumeSound=4        ; 0 none, 1 bleep + "acknowledged", 2 bleep only, 3 "vehicle reporting", 4 EVA "unit ready"
; Refineries repair harvesters while they are docked unloading, at a cost (like the repair bay).
RefineryRepairs=1
RepairStep=10                ; hit points per step
RepairRate=5                 ; ticks between steps
RepairCostPercent=50         ; % of the harvester price for a full repair (stock repair bay is similar)

[WaveAI]
; Organised attack waves for skirmish AI (replaces the stock timed "everyone hunt").
Enabled=1
FirstDelay=60              ; seconds before the wave controller starts
HomeGuard=3                ; units kept back to defend the base
FirstWaveValue=3000         ; wave size is measured in credits of units (rifleman 100, light tank 600, mammoth 1500)
GrowthPerWave=1000         ; each wave must be worth this much more
GrowthPerFailure=1000      ; ...and this much more for every wave that failed
MaxWaveValue=15000
MinSecondsBetweenWaves=60
MaxGatherSeconds=240       ; launch with half a wave if gathering takes this long
RallyDistance=8            ; cells from its base towards you
StagingDistance=10         ; cells outside your base where the wave regroups
AdvanceTimeout=120         ; seconds before attacking even if stragglers are missing
StallSeconds=20            ; attack from where it is if the wave stops getting closer for this long
RetreatPercent=35          ; pull back when the wave is below this % of its starting strength

[Production]
; Extra factories of the same type speed up that build queue (like Red Alert).
; The sidebar can only show one queue per category, so this is a speed bonus, not extra queues.
; Speed = 1 + Bonus% x (factories - 1):  2 factories = 1.5x, 3 = 2x, 4 = 2.5x with the defaults.
MultipleFactoriesSpeedUp=1
BonusPercentPerExtraFactory=50
MaxFactoriesCounted=4
IncludeConstructionYards=1   ; extra construction yards speed up buildings too

; JamesMod settings - read at the start of every game, no rebuild needed.
; Delete a line to go back to the original EA value. Check JAMESMOD.LOG after
; starting a game to see what actually loaded.

[Game]
; Skirmish starting credits as % of the lobby setting, plus a flat bonus.
; Try 1000 for a quick check that the mod is live.
CreditsPercent=100
CreditsBonus=0

[AI]
; Attack timing. Each unit = a random 0.5-2 minutes. EA defaults: 3 and 5.
AttackInterval=2
AttackDelay=3

; Base building - ratio is % of the AI's buildings, limit is the max count.
; EA defaults: Refinery 16%/4, Barracks 16%/2, War Factory 10%/2, Defence 40%/40
RefineryRatio=20
RefineryLimit=5
WarRatio=15
WarLimit=3
BarracksLimit=2

[Harvester]
; Light machine gun on harvesters. By default it only fires at infantry that are
; shooting at the harvester (stray civilians, farmers, lone riflemen). Passive
; civilians are never targeted.
SelfDefence=1
PlayerHarvesters=1
AIHarvesters=1
FireAtAnyEnemy=0     ; 1 = also shoot enemy infantry in range that are not attacking it
Range=3              ; cells (a rifleman is ~2-3)
Damage=15            ; per burst (M16 rifleman = 15, humvee MG = 15)
RateOfFire=15       ; ticks between bursts (lower = faster; ~15 ticks per second at normal speed)

; Player harvesters left sitting on guard (after chasing an attacker, or being moved
; out of danger) go back to harvesting once it is safe. Keep one selected to hold it.
AutoResume=1
ResumeDelay=20       ; seconds idle before resuming
SafeTime=10          ; seconds since it was last shot before resuming
ResumeMessage=1      ; on-screen "Harvester resuming harvesting" message
ResumeSound=4        ; 0 none, 1 bleep + "acknowledged", 2 bleep only, 3 "vehicle reporting", 4 EVA "unit ready"
